name: Build Bluesky Web

on:
  push:
    branches: [ dev ]

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js and Yarn
        run: |
          # install nodejs
          nvm install
          nvm use
          npm install --global yarn

      - name: Setup tools and deps
        run: yarn install --frozen-lockfile

      - name: Start the web dev server
        run: yarn web

      - name: Build Web
        run: yarn build-web
