name: Build Bluesky Web

on:
  push:
    branches: [ dev ]

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Set up Node.js using latest available version of Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install yarn dependencies
        run: yarn

      - name: Start Web App
        run: yarn start

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build
