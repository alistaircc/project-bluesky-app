name: Build Bluesky Web

on:
  push:
    branches: [ dev ]

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
  
      - name: Install Yarn & NPM Dependencies
        run: yarn install

      - name: Run Unit Tests
        run: yarn test

      - name: Run Project
        run: |
          yarn bootstrap
          yarn web
